
services:
  spark-master:
    image: apache/spark:3.5.7
    container_name: gfi-spark-master
    hostname: spark-master
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master"]
    environment:
      - SPARK_NO_DAEMONIZE=true
    ports:
      - "8085:8080"
      - "7077:7077"
    networks:
      - gfi-network
    volumes:
      - ./:/opt/spark/work-dir/gfi
      - ./data:/opt/spark-data
      - ./src:/opt/spark-apps
      - ./jars/postgresql-42.7.4.jar:/opt/spark/jars/postgresql-42.7.4.jar:ro

  spark-worker-1:
    image: apache/spark:3.5.7
    container_name: gfi-spark-worker-1
    hostname: spark-worker-1
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1g
    depends_on:
      - spark-master
    networks:
      - gfi-network
    volumes:
      - ./data:/opt/spark-data
      - ./src:/opt/spark-apps
      - ./jars/postgresql-42.7.4.jar:/opt/spark/jars/postgresql-42.7.4.jar:ro

  spark-worker-2:
    image: apache/spark:3.5.7
    container_name: gfi-spark-worker-2
    hostname: spark-worker-2
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker", "spark://spark-master:7077"]
    environment:
      - SPARK_NO_DAEMONIZE=true
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=1g
    depends_on:
      - spark-master
    networks:
      - gfi-network
    volumes:
      - ./data:/opt/spark-data
      - ./src:/opt/spark-apps
      - ./jars/postgresql-42.7.4.jar:/opt/spark/jars/postgresql-42.7.4.jar:ro

networks:
  gfi-network:
    driver: bridge
